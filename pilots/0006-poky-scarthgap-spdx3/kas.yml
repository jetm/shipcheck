# kas-container build configuration for pilot 0006.
#
# Target: poky Scarthgap, qemux86-64, core-image-minimal
# Inherits: create-spdx-3.0 + cve-check, so the shipcheck pilot has
# real SPDX 3.0 documents under tmp/deploy/spdx/ and a real CVE summary
# at tmp/log/cve/cve-summary.json to audit against.
#
# This pilot validates the SPDX 3.0 path under create-spdx-3.0.bbclass.
# Yocto's create-spdx-3.0 class is opt-in on Scarthgap (default on
# Walnascar/5.2); enabling it on a Scarthgap LTS build matches what
# embedded teams on the LTS see today when they switch generators.
# The forked configuration replaces create-spdx (SPDX 2.2) with
# create-spdx-3.0 so shipcheck's sbom-generation check exercises the
# 3.0 detection, JSON-LD @graph traversal, and Sbom rootElement
# resolution paths against ground-truth Yocto output.
#
# Poky source: upstream git URL
# https://git.yoctoproject.org/poky.git pinned to the same commit
# (cb2dcb4963e5fbe449f1bcb019eae883ddecc8ec) used by pilot 0001 so
# downloads and sstate caches are reused across pilots.
#
# Designed to run with vanilla kas-container from the shipcheck
# repo root:
#
#     kas-container build pilots/0006-poky-scarthgap-spdx3/kas.yml
#
# No --runtime-args and no host-specific bind-mounts are required.
#
# Cache reuse: kas-container auto-mounts $DL_DIR as /downloads and
# $SSTATE_DIR as /sstate inside the container when those env vars
# are set on the host, so this pilot reuses pilot 0001's downloads
# and sstate artefacts. See docs/pilot.md for the recommended env-var
# setup.

header:
  version: 14

distro: poky
machine: qemux86-64
target: core-image-minimal

repos:
  # The shipcheck repo itself - no layers to add, just lets kas
  # anchor relative paths against this file's location. The
  # `layers: {}` override stops kas from treating the repo root
  # as a layer (default behaviour when layers is omitted).
  shipcheck:
    layers: {}

  poky:
    # Upstream Yocto poky, pinned to the same Scarthgap LTS commit
    # used by pilot 0001 so kas-container can clone it fresh into
    # /work/poky without needing any host bind-mounts and so the
    # sstate cache from pilot 0001 stays warm for this pilot.
    url: https://git.yoctoproject.org/poky.git
    branch: scarthgap
    commit: cb2dcb4963e5fbe449f1bcb019eae883ddecc8ec
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

# Forward host environment variables to bitbake via
# BB_ENV_PASSTHROUGH_ADDITIONS. kas-container forwards these via
# `-e <VAR>` into the container; kas then exposes them to bitbake.
#
# null value means "only forward if the caller has it set" with no
# committed default - the right pattern for secrets.
env:
  NVDCVE_API_KEY:

local_conf_header:
  shipcheck-pilot: |
    # Enable the two Yocto classes whose output shipcheck audits.
    # create-spdx-3.0 produces tmp/deploy/spdx/*.spdx.json documents in
    # SPDX 3.0 JSON-LD form; cve-check produces per-recipe CVE reports
    # plus the aggregate summary at tmp/log/cve/cve-summary.json.
    #
    # INHERIT:remove drops the default create-spdx (SPDX 2.2) class
    # that pilot 0001 uses, then INHERIT += pulls in create-spdx-3.0
    # so this pilot emits SPDX 3.0 instead of 2.2. cve-check stays
    # inherited so the CVE outputs remain available for cross-check.
    INHERIT:remove = "create-spdx"
    INHERIT += "create-spdx-3.0"
    INHERIT += "cve-check"

    # cve-check defaults. The cve-check.bbclass task
    # do_cve_check_write_rootfs_manifest creates a symlink at
    # ${LOG_DIR}/cve/cve-summary.json pointing at the latest per-image
    # aggregate manifest, and shipcheck's yocto-cve-check reads that
    # symlink directly - so no path override is needed here.
    #
    # Do NOT override CVE_CHECK_LOG_JSON, CVE_CHECK_SUMMARY_DIR, or
    # CVE_CHECK_SUMMARY_FILE_NAME_JSON. CVE_CHECK_LOG_JSON defaults to
    # ${T}/cve.json (the per-recipe temp dir, always exists); pointing
    # it at the aggregate summary path causes the first recipe's
    # do_cve_check to FileNotFoundError because the aggregate dir is
    # only created later by the per-image manifest task. See
    # docs/pilot.md Troubleshooting for the full story.
    CVE_CHECK_DB_UPDATE = "1"
    CVE_CHECK_FORMAT_JSON = "1"

    # Keep the build deterministic-ish for the pilot: one thread per
    # CPU core, standard sstate reuse. Anyone re-running the pilot
    # can override via environment variables.
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE    ?= "-j ${@oe.utils.cpu_count()}"

    # create-spdx-3.0 options. Default SPDX_INCLUDE_SOURCES is off; we
    # leave it off because this pilot audits the metadata layer, not
    # the source archive layer. Flip to "1" in later pilots if
    # license-audit needs source-file granularity.
    SPDX_INCLUDE_SOURCES = "0"

    # Make the SBOM and CVE outputs reproducible enough to diff
    # across re-runs of the same pilot.
    BB_HASHCONFIG_IGNORE_VARS += "DATE TIME"
